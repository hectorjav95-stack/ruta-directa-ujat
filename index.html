}

:root[data-theme="dark"]{

  --chip:#1f2d28; --map-bg:#1a2420; --grid:#24322c; --ok:#86efac; --warn:#fbbf24; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;margin:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#app{display:flex;height:100%;min-width:0}
#side{width:390px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:5}
#mapwrap{flex:1;min-width:0;position:relative}
#map{position:absolute;inset:0;background-color:var(--map-bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.head{padding:16px max(16px,env(safe-area-inset-left,0px)) 12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.head h1{font-size:20px;line-height:1.15;font-weight:700}
.head small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#toggle{display:none;margin-left:auto;border:1px solid var(--line);background:var(--chip);border-radius:8px;min-height:44px;min-width:44px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 4px;min-height:44px;font-weight:600;color:var(--muted);font-size:12px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.body{flex:1;overflow-y:auto;padding:16px;min-height:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;align-items:stretch}
select{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:0 12px;min-height:44px;font-weight:600;font-size:13px;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.pinA,.pinB{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px}
.pinA{background:#16a34a}.pinB{background:#dc2626}
.hint{color:var(--muted);font-size:12px;margin:0 0 12px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;background:var(--panel)}
.card.best{border-color:var(--accent);background:var(--accent-soft)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:3px 8px;color:#fff;font-weight:700;font-size:12px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding-bottom:12px;position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;border-left:2px dashed var(--line)}
.dot{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:700}
.steps b{font-weight:600}
.m{font-variant-numeric:tabular-nums;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--chip);border-radius:8px;padding:8px}
.kpi span{display:block;font-size:11px;color:var(--muted)}
.kpi strong{font-family:var(--font-display);font-size:18px;font-variant-numeric:tabular-nums}
.alt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.alt:first-of-type{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:0 12px;min-height:44px;font-size:12px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.rcard{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.rcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rcard h3{font-size:15px;line-height:1.25;margin:8px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12px}
.stoplist{margin:10px 0 0;padding:0 0 0 4px;list-style:none;border-left:3px solid var(--rc,#888)}
.stoplist li{padding:3px 0 3px 12px;font-size:13px;position:relative}
.stoplist li::before{content:"";position:absolute;left:-7px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--rc,#888)}
.guide p,.guide li{line-height:1.5}
.guide h3{font-size:16px;margin:18px 0 6px}
.guide ul{padding-left:18px;margin:6px 0}
.note{background:var(--chip);border-radius:8px;padding:10px;font-size:12px;color:var(--muted);margin-top:16px}
#status{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:900;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;max-width:calc(100% - 24px);color:var(--muted)}
#banner{position:absolute;top:12px;left:12px;right:70px;z-index:900;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:12px}
#pickhint{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:950;background:var(--ink);color:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13px}
.layers{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line)}
.lyr{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:0 12px;min-height:44px;font-size:12px;font-weight:600}
.lyr[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.rd{margin:8px 0 0;font-size:12px;line-height:1.45;color:var(--muted)}
.alt .badge{white-space:nowrap}
.empty{color:var(--muted);padding:12px 0}

/* ---------- Ajuste a calles con OSRM (solo la ruta mostrada; si falla, queda el trazado aproximado) ---------- */
var SC={},snapTok=0;
function legWps(l){
 var r=l.r,a=nearest(r.wp,l.b.pt),b=nearest(r.wp,l.a.pt);
 if(!a||!b)return [l.b.pt,l.a.pt];
 var fwd=a.s<=b.s,lo=fwd?a:b,hi=fwd?b:a,pts=[lo.pt].concat(r.wp.slice(lo.i+1,hi.i+1),[hi.pt]);
 return fwd?pts:pts.reverse();
}
function osrmRoute(pts,keepAll){
 pts=pts.filter(okPt);if(pts.length<2)return Promise.reject(new Error("pts"));
 var key=(keepAll?"k":"")+pts.map(function(p){return p[0].toFixed(5)+","+p[1].toFixed(5)}).join(";");
 if(SC[key])return SC[key];
 function ask(list){
  var ctl=typeof AbortController!=="undefined"?new AbortController():null;
  var url="https://router.project-osrm.org/route/v1/driving/"+list.map(function(p){return p[1].toFixed(6)+","+p[0].toFixed(6)}).join(";")+"?overview=full&geometries=geojson&continue_straight=false";
  var lim=new Promise(function(_,rej){setTimeout(function(){if(ctl)ctl.abort();rej(new Error("timeout"))},3000)});
  return Promise.race([fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){return r.json()}),lim]).then(function(j){
   var rt=j&&j.routes&&j.routes[0];if(!rt||!rt.geometry||!Array.isArray(rt.geometry.coordinates))throw new Error("noroute");
   var c=rt.geometry.coordinates.map(function(q){return[q[1],q[0]]}).filter(okPt);
   if(c.length<2)throw new Error("short");
   return {coords:c,km:rt.distance/1000,wps:j.waypoints||[]};
  });
 }
 /* un waypoint a más de 60 m de una calle se descarta y se pide de nuevo, para evitar desvíos */
 var p=ask(pts).then(function(o){
  var keep=pts.filter(function(q,i){var w=o.wps[i];return i===0||i===pts.length-1||!w||typeof w.distance!=="number"||w.distance<=60});
  if(!keepAll&&keep.length<pts.length&&keep.length>=2)return ask(keep).catch(function(){return o});
  return o;
 });
 SC[key]=p;p.catch(function(){delete SC[key]});return p;
}
function snap(){
 var x=cur(),tok=++snapTok;if(!x)return;
 var jobs=x.legs.map(function(l){
  if(l.r.sys==="fluvial"||l.snapped)return Promise.resolve(false);
  return osrmRoute(legWps(l)).then(function(o){
   l.seg=o.coords;l.km=o.km;l.snapped=true;
   l.b={pt:o.coords[0],s:l.b.s,i:l.b.i,d:0};l.a={pt:o.coords[o.coords.length-1],s:l.a.s,i:l.a.i,d:0};return true;
  }).catch(function(){return false});
 });
 Promise.all(jobs).then(function(res){
  if(tok!==snapTok||cur()!==x)return;
  var any=res.some(Boolean),f=x.legs[0],e=x.legs[x.legs.length-1];
  if(any){
   x.w0=hav(S.A.c,f.b.pt)||x.w0;x.w1=hav(e.a.pt,S.B.c)||x.w1;
   if(x.kind==="xfer")x.wm=hav(x.legs[0].a.pt,x.legs[1].b.pt)||x.wm;
   x.walk=x.w0+x.wm+x.w1;x.km=x.legs.reduce(function(sum,l){return sum+l.km},0);
  }
  x.state=any?"ok":(x.legs.every(function(l){return l.r.sys==="fluvial"})?"fluvial":"fail");
  render();
 });
}

 h+='<div class="field"><label for="edsel">Ruta</label><select id="edsel">'+ROUTES.map(function(q){return'<option value="'+q.id+'"'+(q.id===S.edit?" selected":"")+'>'+esc(q.lab+" · "+q.n)+'</option>'}).join("")+'</select></div>';
 h+='<div class="row" style="margin-bottom:8px"><button class="btn" data-em="insert" type="button" aria-pressed="'+(S.emode!=="append")+'" style="flex:1">Insertar en el tramo</button><button class="btn" data-em="append" type="button" aria-pressed="'+(S.emode==="append")+'" style="flex:1">Agregar al final</button></div>';
 h+='<p class="hint">Clic en el mapa agrega un punto. Arrastra un punto para moverlo. Clic derecho o doble clic lo quita. Coloca los puntos sobre el eje de la calle, en cada giro y cada pocas cuadras. <b id="edcount">'+r.wp.length+' puntos</b></p>';
 h+='<div class="row" style="margin-bottom:8px"><button class="btn" id="edundo" type="button" style="flex:1">Quitar último punto</button><button class="btn ghost" id="edreset" type="button" style="flex:1">Restablecer ruta</button></div>';
 h+='<div class="field"><label for="edout">Datos de todas las rutas</label><textarea id="edout" readonly rows="8" style="width:100%;font:12px monospace;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px">'+esc(edExport())+'</textarea></div>';
 h+='<div class="row"><button class="btn" id="edcopy" type="button" style="flex:1">Copiar datos</button><button class="btn ghost" id="edclear" type="button" style="flex:1">Borrar mis cambios</button></div><p class="hint" id="edmsg" role="status" style="margin-top:8px"></p>';
 return h;
}
function edMsg(t){var m=document.getElementById("edmsg");if(m)m.textContent=t}

/* ---------- Eventos ---------- */
function sizeFix(){setTimeout(function(){map.invalidateSize()},60)}
function onPanel(e){
 var t=e.target.closest("button");if(!t)return;
 if(t.dataset.sys){S.sys[t.dataset.sys]=!S.sys[t.dataset.sys];
   var fr=ROUTES.filter(function(x){return x.id===S.focus})[0];if(fr&&!S.sys[fr.sys])S.focus=null;run(false);return}
 if(t.dataset.em){S.emode=t.dataset.em;render();return}
 if(t.id==="edundo"){var er=edRoute();if(er&&er.wp.length>2){er.wp.pop();edChanged()}return}
 if(t.id==="edreset"){var er2=edRoute();if(er2){er2.wp=er2.orig.map(function(p){return[p[0],p[1]]});edChanged();render()}return}
 if(t.id==="edclear"){ROUTES.forEach(function(r){r.wp=r.orig.map(function(p){return[p[0],p[1]]});rebuild(r)});XF={};try{localStorage.removeItem("rd_wp")}catch(e){}render();edMsg("Cambios borrados.");return}
 if(t.id==="edcopy"){var ta=document.getElementById("edout"),txt=edExport();ta.select();var ok=function(){edMsg("Datos copiados. Pégalos en el chat.")},no=function(){edMsg("Selecciona el texto y cópialo con Ctrl+C.")};try{navigator.clipboard.writeText(txt).then(ok,no)}catch(e){no()}return}
 if(t.dataset.tab){S.tab=t.dataset.tab;if(S.tab==="edit"&&!S.edit)S.edit=ROUTES[0].id;if(S.tab!=="cat")S.focus=null;S.pick=null;render();if(S.tab==="calc")fitResult();
   if(S.tab==="edit"){var er3=edRoute();if(er3&&er3.wp.length)map.fitBounds(L.latLngBounds(er3.wp),{padding:[50,50]})}
   if(S.tab==="cat"||S.tab==="guide")map.fitBounds(L.latLngBounds(POIS.map(function(p){return p.c}).filter(function(c){return c[1]>-93})),{padding:[40,40]});return}
 if(t.id==="pickA"||t.id==="pickB"){var k=t.id.slice(-1);S.pick=S.pick===k?null:k;render();
   if(S.pick&&window.matchMedia("(max-width:820px)").matches){document.getElementById("app").classList.add("collapsed");sizeFix()}return}
 if(t.id==="swap"){var a=S.A;S.A=S.B;S.B=a;run(true);return}
 if(t.id==="clear"){S.A=null;S.B=null;S.res=null;S.pick=null;render();map.setView([17.9915,-92.9350],13);return}
 if(t.dataset.sel){S.sel=+t.dataset.sel;render();fitResult();snap();return}
 if(t.dataset.f){S.filter=t.dataset.f;S.focus=null;render();
   var f=FILTERS.filter(function(x){return x.id===S.filter})[0];
   if(f.p)map.fitBounds(L.latLngBounds(f.p.map(function(id){return poi(id).c})),{padding:[80,80],maxZoom:15});
   else map.setView([17.9915,-92.9350],13);return}
 if(t.dataset.r){S.focus=S.focus===t.dataset.r?null:t.dataset.r;render();
   var r=ROUTES.filter(function(x){return x.id===S.focus})[0];if(r&&r.geom.length)map.fitBounds(L.latLngBounds(r.geom),{padding:[50,50]});snapFocus();}
}
document.getElementById("side").addEventListener("click",onPanel);
document.getElementById("side").addEventListener("change",function(e){
 if(e.target.id==="edsel"){S.edit=e.target.value;render();var er4=edRoute();if(er4&&er4.wp.length)map.fitBounds(L.latLngBounds(er4.wp),{padding:[50,50]});return}
 if(e.target.id==="selA"||e.target.id==="selB"){var k=e.target.id.slice(-1);setPoint(k,null,e.target.value);run(true);}
});
map.on("click",function(e){
 var ll=[e.latlng.lat,e.latlng.lng];
 if(S.tab==="edit"){edAdd(ll);return}
 if(S.pick){var k=S.pick;S.pick=null;setPoint(k,ll,null);S.tab="calc";run(true);return}
 if(S.tab==="calc"&&(!S.A||!S.B)){setPoint(S.A?"B":"A",ll,null);run(true)}
});
document.getElementById("toggle").addEventListener("click",function(){
 var c=document.getElementById("app").classList.toggle("collapsed");this.setAttribute("aria-expanded",!c);sizeFix();
});
window.addEventListener("resize",sizeFix);

/* ---------- Inicio: todas las rutas y marcadores; sin cálculo hasta tener A y B ---------- */
if(EDITOR){var tabs=document.querySelector(".tabs"),eb=document.createElement("button");eb.className="tab";eb.setAttribute("role","tab");eb.id="t-edit";eb.dataset.tab="edit";eb.textContent="Editor";eb.setAttribute("aria-selected","false");tabs.appendChild(eb)}
render();
setTimeout(function(){map.invalidateSize()},250);
})();
</script>
